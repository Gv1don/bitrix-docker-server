services:
  nginx:
    image: nginx:stable-alpine
    container_name: bitrix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/bitrix.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www:/var/www:ro
    depends_on:
      - php
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - bitrix

  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.3"
        HOST_UID: "1000"
        HOST_GID: "1000"
    container_name: bitrix-php
    restart: unless-stopped
    volumes:
      - ./www:/var/www
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
    networks:
      - bitrix

  mysql:
    image: percona/percona-server:8.0
    container_name: bitrix-mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bitrix}
      MYSQL_USER: ${MYSQL_USER:-bitrix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bitrixpassword}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bitrix

  memcached:
    image: memcached:alpine
    container_name: bitrix-memcached
    restart: unless-stopped
    command: memcached -m 2048 -u appuser
    expose:
      - "11211"
    networks:
      - bitrix

  memcached-sessions:
    image: memcached:alpine
    container_name: bitrix-memcached-sessions
    restart: unless-stopped
    command: memcached -m 128 -u appuser
    expose:
      - "11211"
    networks:
      - bitrix

volumes:
  mysql_data:
    driver: local

networks:
  bitrix:
    driver: bridge
