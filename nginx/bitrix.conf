upstream php-fpm {
    server php:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html bitrixsetup.php;
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive directories
    location ~* /bitrix/modules { deny all; }
    location ~* /bitrix/php_interface { deny all; }
    location ~* /bitrix/tools { deny all; }
    location ~* /bitrix/backup { deny all; }
    location ~* /bitrix/stack_cache { deny all; }
    location ~* /bitrix/managed_cache { deny all; }
    location ~* /\.ht { deny all; }
    location ~* /\.git { deny all; }
    location ~* /\.env { deny all; }

    # Static files with caching
    location ~* \.(jpg|jpeg|gif|png|svg|webp|avif|ico|bmp|tiff)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Main routing
    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @bitrix {
        rewrite ^/bitrix/urlrewrite.php$is_args$args last;
    }

    # PHP processing
    location ~ \.php$ {
        try_files $uri $uri/ /bitrix/urlrewrite.php$is_args$args;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 21600;
        fastcgi_send_timeout 21600;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 1C exchange and restore
    location ~ ^/(restore\.php|bitrix/admin/1c_exchange\.php)$ {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        client_body_buffer_size 1024m;
        client_max_body_size 1024m;
        fastcgi_read_timeout 21600;
        fastcgi_send_timeout 21600;
    }

    # Upload directory
    location ~ /upload/ {
        client_body_buffer_size 1024m;
        client_max_body_size 1024m;
    }

    # AJAX rate limiting
    location ~* /ajax/ {
        limit_req zone=ajax burst=20 nodelay;
        try_files $uri $uri/ /bitrix/urlrewrite.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 21600;
        }
    }

    # Deny access to hidden files (except well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Favicon and robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}

